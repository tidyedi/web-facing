[project]
name = "x12-tidy-web"
version = "0.1.0"
description = "Web front end for x12-tidy: paste malformed X12 EDI, get an iterative repair and a downloadable report"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Michael Schertz", email = "michael.schertz@gmail.com" }]

dependencies = [
    # The one external import. Pulled from the x12-tidy repo over the network and
    # imported like any other third-party package -- never vendored, never a path
    # link to a local checkout. Any fix to x12-tidy is made in the x12-tidy repo;
    # here you only bump this ref (and re-run `uv lock`).
    "x12-tidy @ git+https://github.com/tidyedi/x12-tidy.git@main",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
x12-tidy-web = "x12_tidy_web.cli:main"

[project.urls]
Homepage = "https://github.com/tidyedi/web-facing"
Repository = "https://github.com/tidyedi/web-facing"
"x12-tidy" = "https://github.com/tidyedi/x12-tidy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# x12-tidy is installed straight from its git repo (it has no PyPI release yet).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Ships the whole package directory, templates/ and static/ included.
packages = ["src/x12_tidy_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient nudges toward a not-yet-released httpx2; harmless.
    # The warning is a StarletteDeprecationWarning (a UserWarning subclass), so it
    # must be matched by that category, not DeprecationWarning.
    "ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
# x12-tidy is fully type-hinted but ships no py.typed marker yet.
module = ["x12_tidy.*"]
ignore_missing_imports = true
